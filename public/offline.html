    p { color: #4b5563; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #006B3F; color: #fff; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">SL</div>
    <h1>You are offline</h1>
